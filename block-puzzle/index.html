<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#171638">
  <title>بلوك بارتي — لعبة المكعبات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <span class="eyebrow">وقت صغير · تحدٍ كبير</span>
      <h1>بلوك <span>بارتي</span> ✦</h1>
      <p>رتّب المكعبات… واصنع مساحة للمزيد!</p>
    </header>

    <section class="toolbar" aria-label="نتائج اللعبة">
      <div class="stat">
        <span>النقاط</span>
        <strong id="score">0</strong>
      </div>

      <button
        id="restart"
        class="icon-button"
        aria-label="بدء لعبة جديدة"
        title="لعبة جديدة"
      >↻</button>

      <div class="stat best">
        <span>♛ أعلى نتيجة</span>
        <strong id="best">0</strong>
      </div>
    </section>

    <div class="board-wrap">
      <div
        id="board"
        class="board"
        role="group"
        aria-label="لوحة اللعب: 8 صفوف و8 أعمدة"
      ></div>
      <div id="celebration" aria-hidden="true"></div>
    </div>

    <p
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    >جارٍ تحميل اللعبة…</p>

    <noscript>
      تحتاج اللعبة إلى تفعيل JavaScript في المتصفح.
    </noscript>

    <section
      id="tray"
      class="tray"
      aria-label="القطع المتاحة"
    ></section>

    <p class="hint">
      أكمل صفًا أو عمودًا لإزالته ✨
      <br>
      استخدم القطع الثلاث لتحصل على مجموعة جديدة
    </p>

    <aside
      id="ad-banner"
      class="ad-banner"
      aria-label="مساحة إعلان"
    >
      <span>إعلان</span>
      <span>مساحة البانر</span>
    </aside>

    <footer>
      استراحة ملونة لعقلك <span>✦</span>
    </footer>
  </main>

  <dialog id="game-over" aria-labelledby="over-title">
    <div class="modal-icon">✦</div>
    <h2 id="over-title">جولة جميلة!</h2>
    <p>لم تعد هناك مساحة للقطع المتبقية.</p>

    <span class="final-label">نتيجتك</span>
    <strong id="final-score">0</strong>
    <p id="record-note"></p>

    <button id="play-again" class="primary">
      لنلعب مرة أخرى ↻
    </button>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
