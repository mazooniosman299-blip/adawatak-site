name: Build Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Prepare game
        shell: bash
        run: |
          set -euo pipefail

          node --check block-puzzle/game.js
          grep -qi '<!doctype html>' block-puzzle/index.html
          grep -q 'id="board"' block-puzzle/index.html
          test -s block-puzzle/style.css

          APP_DIR="$RUNNER_TEMP/block-party"
          mkdir -p "$APP_DIR/www"

          cp block-puzzle/index.html block-puzzle/style.css "$APP_DIR/www/"
          cp block-puzzle/game.js "$APP_DIR/game-source.js"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install Capacitor and AdMob
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          npm init -y
          npm install --save-exact @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3 @capacitor-community/admob@8.2.1 esbuild@0.25.12

      - name: Configure production AdMob units
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          cat > ads-entry.js <<'JS'
          import { Capacitor } from '@capacitor/core';
          import {
            AdMob,
            AdmobConsentStatus,
            BannerAdSize,
            BannerAdPosition,
            BannerAdPluginEvents,
            InterstitialAdPluginEvents
          } from '@capacitor-community/admob';

          // Production AdMob units. Publish only after store and AdMob approval.
          const BANNER = 'ca-app-pub-5086201923236113/6484365837';
          const INTERSTITIAL = 'ca-app-pub-5086201923236113/4763345196';

          let adStage = 'consent';
          let initialized = false;
          let loaded = false;
          let loading = false;
          let rounds = 0;
          let lastShown = 0;

          const note = text => {
            const el = document.getElementById('ad-banner');

            if (el) {
              el.hidden = false;
              el.textContent = text;
              el.style.cssText += ';height:auto;min-height:70px;padding:12px;display:block;overflow-wrap:anywhere;white-space:pre-wrap';
            }
          };

          const preload = async () => {
            if (!initialized || loaded || loading) return;

            loading = true;

            try {
              await AdMob.prepareInterstitial({
                adId: INTERSTITIAL,
                isTesting: false
              });

              loaded = true;
            } catch (error) {
              console.warn('Interstitial:', error);
            } finally {
              loading = false;
            }
          };

          async function initializeAds() {
            adStage = 'consent';

            let consent = await AdMob.requestConsentInfo();

            if (
              consent.isConsentFormAvailable &&
              consent.status === AdmobConsentStatus.REQUIRED
            ) {
              adStage = 'consent-form';
              consent = await AdMob.showConsentForm();
            }

            if (
              consent.privacyOptionsRequirementStatus === 'REQUIRED'
            ) {
              const button = document.createElement('button');

              button.textContent = 'خيارات الخصوصية';
              button.className = 'icon-button';
              button.style.cssText =
                'width:auto;font-size:12px;padding:8px;margin:12px';

              button.onclick = async () => {
                button.disabled = true;
                initialized = false;
                loaded = false;

                try {
                  await AdMob.removeBanner();
                  await AdMob.showPrivacyOptionsForm();
                  location.reload();
                } catch (error) {
                  console.warn(error);
                  location.reload();
                }
              };

              document.querySelector('footer')?.append(button);
            }

            if (!consent.canRequestAds) {
              note('الإعلانات متوقفة حسب حالة الموافقة');
              return;
            }

            adStage = 'initialize';

            await AdMob.initialize();
            initialized = true;

            await AdMob.addListener(
              BannerAdPluginEvents.SizeChanged,
              size => {
                const height = Math.max(
                  0,
                  Number(size.height) || 0
                );

                document.body.style.paddingBottom =
                  `${height + 12}px`;
              }
            );

            await AdMob.addListener(
              BannerAdPluginEvents.Loaded,
              () => note('إعلان')
            );

            await AdMob.addListener(
              BannerAdPluginEvents.FailedToLoad,
              error => note(
                'AdMob [banner-load]: ' +
                (error?.message || error?.code || String(error))
              )
            );

            await AdMob.addListener(
              InterstitialAdPluginEvents.Dismissed,
              () => {
                loaded = false;
                void preload();
              }
            );

            await AdMob.addListener(
              InterstitialAdPluginEvents.FailedToShow,
              () => {
                loaded = false;
              }
            );

            void preload();

            adStage = 'banner';

            await AdMob.showBanner({
              adId: BANNER,
              isTesting: false,
              adSize: BannerAdSize.ADAPTIVE_BANNER,
              position: BannerAdPosition.BOTTOM_CENTER,
              margin: 0
            });
          }

          window.BlockPuzzleAds = {
            async showBanner() {
              if (!Capacitor.isNativePlatform()) return;

              note('جارٍ تجهيز الإعلان…');

              try {
                await initializeAds();
              } catch (error) {
                console.warn('AdMob:', error);

                note(
                  'AdMob [' + adStage + ']: ' +
                  (error?.message || error?.code || String(error))
                );
              }
            },

            async showInterstitial() {
              rounds++;

              if (
                !initialized ||
                !loaded ||
                rounds < 3 ||
                Date.now() - lastShown < 120000
              ) {
                return;
              }

              rounds = 0;
              loaded = false;
              lastShown = Date.now();

              try {
                await AdMob.showInterstitial({
                  adId: INTERSTITIAL
                });
              } catch (error) {
                console.warn(error);
              }
            }
          };
          JS

          cat game-source.js >> ads-entry.js

          npx esbuild ads-entry.js --bundle --format=iife --target=chrome100 --outfile=www/game.js

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          npx cap init "بلوك بارتي" "com.blockparty.puzzle" --web-dir www
          npx cap add android
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)

          path = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(path)
          app = tree.getroot().find('application')

          ET.SubElement(app, 'meta-data', {
              '{' + ns + '}name':
                  'com.google.android.gms.ads.APPLICATION_ID',
              '{' + ns + '}value':
                  'ca-app-pub-5086201923236113~1615182538'
          })

          tree.write(
              path,
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Sign release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          cd "$APP_DIR/android"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          export ORG_GRADLE_PROJECT_android.injected.signing.store.file="$RUNNER_TEMP/release.jks"
          export ORG_GRADLE_PROJECT_android.injected.signing.store.password="$RELEASE_STORE_PASSWORD"
          export ORG_GRADLE_PROJECT_android.injected.signing.key.alias="$RELEASE_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_android.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify and upload release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" apk-output/block-party-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apk-output/block-party-release.apk
          (cd apk-output && sha256sum block-party-release.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: block-party-release
          path: apk-output/
          if-no-files-found: error
